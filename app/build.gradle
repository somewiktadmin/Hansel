// build.gradle - app module
//
// minSdk 21: covers Android 5.0 Lollipop and up.  The TCL museum piece
// runs somewhere in this range.  Do not raise without testing on the
// oldest device in the field kit.
//
// targetSdk / compileSdk 34: required for Play Store submissions as of
// 2024.  Drives several of the permission requirements in AndroidManifest -
// FOREGROUND_SERVICE_LOCATION and the MANAGE_ALL_FILES runtime request
// are both SDK 34 consequences.
//
// versionCode must be a plain integer - Android uses it for update ordering.
// versionName is the human-readable label shown in the Play Store and in
// About screens.  Keep them in sync manually.

plugins {
    id 'com.android.application'
}

android {
    compileSdk 34

    defaultConfig {
        applicationId "com.hansel.app"
        minSdk 21
        targetSdk 34
        versionCode 18 //must be integer
        versionName "v0.988" // For Hansel-v0.988 Note: VERSIONCODE must be an integer (84GB later...) 5/11/2026

        // TODO: migrate to androidx.test.runner.AndroidJUnitRunner -
        // android.support.test.runner is the old support library and is
        // no longer maintained.
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {

    implementation 'com.google.android.material:material:1.6.0'
    implementation 'com.google.android.gms:play-services-location:21.0.1'
    implementation 'androidx.core:core:1.6.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    testImplementation 'junit:junit:4.13.2'
    implementation 'org.osmdroid:osmdroid-android:6.1.18'

}