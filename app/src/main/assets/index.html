     and altitude graph on the bottom 2/5ths.

    This file runs inside an Android WebView (MainActivity.java).
    All GPS data, file I/O, and system calls go through AndroidBridge,
    which is the JavaScript interface name for WebAppInterface.java.

    Architecture: Java owns location, files, and permissions.
    JavaScript owns display, user input, and the say() scrollbox.
    The two sides talk exclusively through AndroidBridge calls (JS to Java)
    and onGPSUpdate() calls (Java to JS via evaluateJavascript()).

    Timezone: HST always.  The device is set to HST.  toHST() is not
    a timezone conversion - it is a datetime formatter that produces
    yyyy-MM-dd_HH-mm-ss strings from the device clock, which is HST.
    Never UTC.  Never assume UTC.  Never convert to UTC.  HST.

    map.png is a static background image of the Kilauea summit area,
    bundled as an Android asset alongside this file.  It is 2019-era.
    OSM tile-based map is the replacement, on top 3/5ths of window, while
    this legacy WebView gets the bottom 2/5ths.

    Sound buttons: case is significant.  "chuff", "CHUFF", and "Chuff"
    are three distinct acoustic observations.  Do not sort, do not
    normalize case, do not deduplicate.  The field researcher chose
    the label deliberately.  TODO: rethink the whole thing, editing list
    from user mode, etc.  Should it all be a pop-up "I HEARD A SOUND"
    window triggered from a tiny speaker icon?  With a pencil "edit"
    icon to reorder and/or delete items?
-->
<html>
<head>
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <style>
            body {
                font-family: sans-serif;
                background: #111;
                color: #eee;
                text-align: center;
            }

            button,
            select {
                font-size: 16px;
                padding: 10px;
                margin: 6px;
                width: 40%;
            }
            .sound-btn {
                font-size: 14px;
                padding: 6px 8px;
                margin: 3px;
                width: auto;
                min-width: 70px;
                display: inline-block;
            }
            #soundPanel {
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
            }

            canvas {
                margin-top: 10px;
                background: #000;
                width: 95%;
                height: auto;
            }
        </style>
</head>

<body><!-- if I keep this, it will go into a titlebar of a window or similar.
<h2 title="Hansel-app logs paths. Gretel-app listens.">Hansel - notes v0.987</h2>
-->

<label>Sample Interval</label>
<select id="interval" onchange="AndroidBridge.setInterval(this.value)">
    <option value="1000">1 sec</option>
    <option selected value="5000">5 sec</option>
    <option value="15000">15 sec</option>
    <option value="30000">30 sec</option>
    <option value="60000">60 sec</option>
    <option value="300000">5 min</option>
    <option value="3600000">1 hr</option>
</select>

<div id="status">Idle</div>
<pre id="readout">Waiting...</pre>

<canvas height="250" id="graph" width="350"></canvas>
<div id="graphScale" style="font-size: 12px; color: #888"></div>

<button class="sound-btn" onclick="resetToKilauea()">
    Reset to Kilauea
</button>
<button class="sound-btn" onclick="resetTo250()">
    Reset to +-250
</button>

<canvas height="350" id="map" width="350"></canvas>

<button onclick="start()">START()</button>
<button onclick="stop()">STOP()</button>
<button onclick="AndroidBridge.consolidateNow()">Rollup</button>

<button onclick="mark()">MARK ME</button>
<button onclick="mark(TODO)">MARK MAP</button>

<div id="soundPanel"></div>

<input
        id="newSound"
        placeholder="Add new sound..."
        style="width: 90%; font-size: 16px; padding: 6px"
/>
<button onclick="addSound()">Add</button>

<div style="margin-top: 10px">
    <input
            id="noteInput"
            placeholder="Add a one-time note..."
            style="width: 90%; font-size: 16px; padding: 6px"
    />
    <button onclick="submitNote()">Add</button>
</div>

<div id="status2">Idle</div>

<textarea
        id="logView"
        rows="12"
        style="width: 99%; background: #000; color: #0f0; font-size: 10px"
></textarea>

<select id="replaySpeed">
    <option value="500">0.5s</option>
    <option value="200">0.2s</option>
    <option value="100">0.1s</option>
    <option value="50">50ms</option>
    <option value="10">10ms</option>
    <option value="1" selected>1ms</option>
</select>
<button onclick="replay()">Replay</button>
<button onclick="replay72h()">72hr</button>

<script>
            const HANSEL_VERSION = "0.987";

            // say() is defined first, before everything else, so that any
            // code anywhere in this file can call it safely.  During early
            // development LOGCAT refused to work (Motorola requires enabling
            // a logger buffer in developer options, default is OFF), so say()
            // became the universal debug and status output for every layer of
            // the project.  It writes to the green scrollbox at the bottom of
            // the screen.  Java calls it via evaluateJavascript(), JavaScript
            // calls it directly.  If you need to know something happened, say() it.
            function say(something) {
                document.getElementById("status2").innerText = something;
                logLines.push(something);
                let ta = document.getElementById("logView");
                ta.value = logLines.join("\n");
                ta.scrollTop = ta.scrollHeight;
            }

            window.onerror = function (msg, src, line) {
                if (line)
                    document.getElementById("status").innerText =
                        "ERR: " + msg + " @ " + line;
            };

            document.getElementById("status").innerText = "JS loaded.";

            // HST coordinates of the north vent, Kilauea summit.
            // "best fix we'll get until another illegal drone flies over"
            const NORTH_VENT_LAT = 19.402;
            const NORTH_VENT_LON = -155.29;

            let isReplaying = false;
            let replayInterval = null;

            let autoAltMin = null;
            let autoAltMax = null;
            let currentAlt = null;

            let overrideAltMin = null;
            let overrideAltMax = null;

            let rollover = 3600;

            // Logging interval in milliseconds.  30_000 is the only correct
            // value - see LocationService.java interval field for the full story.
            let interval = 5000; // 30000 30_000

            let logLines = [];
            let points = [];
            let isRunning = false;
            let lastMarkTime = 0;

            let replayLines = [];   // was allLines, now module-level
            let replayIndex = 0;    // was i, now module-level
            let replaySpeed = 1;    // was local, now module-level

            const map = document.getElementById("map");
            const mctx = map.getContext("2d");
            const graph = document.getElementById("graph");
            const gctx = graph.getContext("2d");
            const img = new Image();

            // Map image bounds around the Kilauea north vent area.
            // Adjust if map.png is ever replaced.
            let bounds = {
                latMin: 19.37,
                latMax: 19.45,
                lonMin: -155.33,
                lonMax: -155.25,
            };

            //
            // main() - called once from window.addEventListener("load").
            //
            // The canvas sizing problem: clientWidth is zero at script parse
            // time because the browser has not performed layout yet.  Inline
            // script runs as the page is parsed, before layout is complete.
            // window.addEventListener("load") fires after the entire document
            // is parsed and laid out, so clientWidth is real by the time
            // main() runs.  initCanvases() therefore always gets valid
            // dimensions, and img.onload fires into a properly sized canvas.
            // start() previously called drawMap() as a band-aid that worked
            // roughly half the time depending on image cache state.  Gone.
            //
            function main() {
                initCanvases();

                img.onload = function () {
                    say("map.png loaded, size: " + img.width + " x " + img.height);
                    drawMap();
                };
                img.onerror = function () {
                    say("map.png FAILED TO LOAD");
                };
                img.src = "map.png";

                loadSounds();
                rebuildButtons();
                saveSounds();

                document
                    .getElementById("noteInput")
                    .addEventListener("keydown", function (e) {
                        if (e.key === "Enter") submitNote();
                    });

                document
                    .getElementById("newSound")
                    .addEventListener("keydown", function (e) {
                        if (e.key === "Enter") addSound();
                    });

                start();
            }

            /**
             * Sizes the map and graph canvases from real layout dimensions.
             * Must be called after layout is complete (i.e. from main()).
             * The || 350 fallback matches the HTML attribute default and
             * prevents a zero-dimension canvas if something goes wrong.
             */
            function initCanvases() {
                map.width = map.clientWidth || 350;
                map.height = map.width;
                graph.width = graph.clientWidth || 350;
                say("canvas init: map=" + map.width + " graph=" + graph.width);
            }

            /**
             * Formats a datetime from the device clock as yyyy-MM-dd_HH-mm-ss.
             * The device is assumed to be set to HST.  This is not a timezone
             * conversion.  The output is HST because the input is HST.
             * Never UTC.
             */
            function toHST() {
                let now = new Date();
                let Y = now.getFullYear();
                let M = String(now.getMonth() + 1).padStart(2, "0");
                let D = String(now.getDate()).padStart(2, "0");
                let h = String(now.getHours()).padStart(2, "0");
                let m = String(now.getMinutes()).padStart(2, "0");
                let s = String(now.getSeconds()).padStart(2, "0");
                return `${Y}-${M}-${D}_${h}-${m}-${s}`;
            }

            /**
             * Formats a lat or lon value to exactly 6 decimal places.
             * Mirrors the Java fmtLatLon() in LocationService.
             * See that method for the rationale on the nudge.
             */
            function fmtLatLon(v) {
                let val = Math.round(parseFloat(v) * 1000000) / 1000000;
                const decimals = val.toString().split(".")[1] || "";
                if (decimals.length < 6) {
                    val += 0.000001;
                    val = Math.round(val * 1000000) / 1000000;
                }
                return val;
            }

            /**
             * Updates the running altitude min/max for graph scaling.
             * Called on every incoming point, live and replay.
             */
            function updateAltRange(alt) {
                currentAlt = alt;
                if (autoAltMin === null || alt < autoAltMin) autoAltMin = alt;
                if (autoAltMax === null || alt > autoAltMax) autoAltMax = alt;
            }

            /**
             * Returns the active display range for the altitude graph.
             * Override values take priority over auto-tracked min/max.
             */
            function getDisplayRange() {
                return {
                    min: overrideAltMin !== null ? overrideAltMin : autoAltMin,
                    max: overrideAltMax !== null ? overrideAltMax : autoAltMax,
                };
            }

            /**
             * Prompts the user to set a manual minimum altitude for the graph.
             */
            function overrideMin() {
                let v = prompt(
                    "Force min altitude (ft):",
                    overrideAltMin ??
                        Math.floor((autoAltMin || 3000) / 500) * 500,
                );
                if (v === null) return;
                overrideAltMin = parseInt(v);
            }

            /**
             * Prompts the user to set a manual maximum altitude for the graph.
             */
            function overrideMax() {
                let v = prompt(
                    "Force max altitude (ft):",
                    overrideAltMax ??
                        Math.ceil((autoAltMax || 4500) / 500) * 500,
                );
                if (v === null) return;
                overrideAltMax = parseInt(v);
            }

            /**
             * Resets graph scaling to Kilauea summit defaults: 3000-4500 ft.
             * Clears any manual overrides.
             */
            function resetToKilauea() {
                overrideAltMin = null;
                overrideAltMax = null;
                autoAltMin = 3000;
                autoAltMax = 4500;
            }

            /**
             * Resets graph scaling to current altitude +- 250 ft.
             * Useful for close-in altitude detail on flat terrain.
             * Clears any manual overrides.
             */
            function resetTo250() {
                overrideAltMin = null;
                overrideAltMax = null;
                autoAltMin = currentAlt - 250;
                autoAltMax = currentAlt + 250;
            }

            /**
             * Haversine distance from current position to the Kilauea north vent.
             * Returns both a human-readable display string and a compact log string.
             * Below 2640ft: distance in feet and football fields.
             * Below 100mi: distance in feet and miles.
             * Above 100mi: distance in miles only.
             *
             * Earth radius is in feet (20925722) because altitude is in feet
             * and the output is in feet and miles.  Not meters.  Not km.  Feet.
             */
            function distToNorthVent(lat, lon) {
                const R = 20925722; // earth radius in feet
                const dLat = ((lat - NORTH_VENT_LAT) * Math.PI) / 180;
                const dLon = ((lon - NORTH_VENT_LON) * Math.PI) / 180;
                const a =
                    Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                    Math.cos((NORTH_VENT_LAT * Math.PI) / 180) *
                        Math.cos((lat * Math.PI) / 180) *
                        Math.sin(dLon / 2) *
                        Math.sin(dLon / 2);
                const ft = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)) * R;
                const mi = ft / 5280;

                let display, log;

                if (ft < 2640) {
                    const ff = Math.round(ft / 360);
                    display =
                        Math.round(ft).toLocaleString() +
                        " ft / " +
                        ff +
                        " football fields";
                    log = Math.round(ft) + "ft";
                } else if (mi < 100) {
                    display =
                        Math.round(ft).toLocaleString() +
                        " ft / " +
                        mi.toFixed(1) +
                        " mi";
                    log = mi.toFixed(1) + "mi";
                } else {
                    display = Math.round(mi).toLocaleString() + " mi";
                    log = Math.round(mi) + "mi";
                }

                return { display, log };
            }

            /**
             * Strips newlines and non-ASCII characters from a note string
             * before display.  NDJSON is one record per line - embedded
             * newlines would break the file format.
             */
            function sanitizeNote(s) {
                return s
                    .replace(/[\r\n]+/g, " ")
                    .replace(/[^\x20-\x7E]/g, "")
                    .trim();
            }

            /**
             * Formats a trackpoint for display in the say() scrollbox.
             * The raw NDJSON timestamp yyyy-MM-dd_HH-mm-ss is reformatted
             * to yyyy-MM-dd HH:mm:ss for readability.
             * vent distance display is commented out for now - line too long.
             */
            function appendLog(d) {
                let ts = d.t
                    .replace("_", " ")
                    .replace(/-(\d{2})-(\d{2})$/, ":$1:$2");

                let note = d.note ? " note: " + sanitizeNote(d.note) : "";
                let line = `${ts} @ ${d.lat.toFixed(5)},${d.lon.toFixed(5)} (${d.alt}') ${note}`;
                logLines.push(line);

                if (logLines.length > 400) {
                    logLines.shift();
                }

                let ta = document.getElementById("logView");
                ta.value = logLines.join("\n");
                ta.scrollTop = ta.scrollHeight;
            }

            // Sound vocabulary for the sound panel buttons.
            // Case is significant - "chuff", "CHUFF", and "Chuff" are three
            // distinct acoustic observations with different intensities.
            // Do not sort.  Do not normalize.  The researcher chose these labels.
            let sounds = [
                "chuff",
                "CHUFF",
                "lava fall",
                "hiss",
                "burp",
                "bacon sizzle",
                "rapids",
                "waterfall",
                "growl",
                "purr",
                "clunker",
                "thud",
                "birds",
                "garage door",
                "hanger bay door",
                "subway train",
                "wind",
                "Wind",
                "WIND NOISE",
                "noise",
                "talking",
                "Pele voice",
                "humans",
                "tourists",
            ];

            /**
             * Adds a new sound label to the panel and persists it.
             * The new label is appended to the end of the sounds array -
             * not sorted, not normalized.
             */
            function addSound() {
                let val = document.getElementById("newSound").value.trim();
                if (!val) return;
                sounds.push(val);
                document.getElementById("newSound").value = "";
                rebuildButtons();
                saveSounds();
            }

            /**
             * Builds the initial sound button panel.  Called once at startup
             * before loadSounds() - replaced immediately by rebuildButtons()
             * after sounds are loaded from localStorage.
             */
            function buildSoundButtons() {
                const panel = document.getElementById("soundPanel");
                sounds.forEach((s) => {
                    let b = document.createElement("button");
                    b.className = "sound-btn";
                    b.innerText = s;
                    b.onclick = () => mark(s);
                    panel.appendChild(b);
                });
            }

            /**
             * Rebuilds the sound button panel from the current sounds array.
             * Called after addSound() or loadSounds() changes the array.
             * Absolutely not alphabetical.  Absolutely not lowercase only.
             * The order reflects field priority, not aesthetics.
             */
            function rebuildButtons() {
                const panel = document.getElementById("soundPanel");
                panel.innerHTML = "";
                sounds.forEach((s) => {
                    let b = document.createElement("button");
                    b.className = "sound-btn";
                    b.innerText = s;
                    b.onclick = () => mark(s);
                    panel.appendChild(b);
                });
            }

            /**
             * Persists the sounds array to localStorage.
             * localStorage works here because MainActivity sets
             * setDomStorageEnabled(true) on the WebView.
             *
             * TODO: Move sound persistence to AndroidBridge so it survives
             *       a WebView data clear without losing field vocabulary.
             */
            function saveSounds() {
                localStorage.setItem("sounds", JSON.stringify(sounds));
            }

            /**
             * Loads the sounds array from localStorage if available.
             * Falls back to the hardcoded default array if not.
             */
            function loadSounds() {
                let s = localStorage.getItem("sounds");
                if (s) sounds = JSON.parse(s);
            }

            /**
             * Returns a CSS color string based on GPS accuracy value.
             * Green = good fix, red = poor fix.
             * acc is retained as a visual indicator only - it is not a
             * reliable data quality metric.  See LocationService acc field
             * comments for the full warning.
             */
            function color(acc) {
                if (acc < 5)  return "#00ff00";
                if (acc < 10) return "#88ff00";
                if (acc < 20) return "#ffff00";
                if (acc < 50) return "#ff8800";
                return "#ff0000";
            }

            /**
             * Draws the map canvas: static background image plus all current
             * points as colored dots.  Called from img.onload at startup and
             * on every incoming GPS point.
             * The background image is map.png, a static 2019-era raster of
             * the Kilauea summit area.  OSM tile replacement is pending.
             */
            function drawMap() {
                if (img.complete) {
                    mctx.drawImage(img, 0, 0, map.width, map.height);
                }
                for (let p of points) {
                    let xy = latLonToXY(p.lat, p.lon);
                    mctx.fillStyle = color(p.acc);
                    mctx.beginPath();
                    mctx.arc(xy.x, xy.y, 2, 0, Math.PI * 2);
                    mctx.fill();
                }
            }

            /**
             * Projects a lat/lon coordinate onto the map canvas pixel space
             * using the bounds rectangle defined above.
             */
            function latLonToXY(lat, lon) {
                let x =
                    ((lon - bounds.lonMin) / (bounds.lonMax - bounds.lonMin)) *
                    map.width;
                let y =
                    ((bounds.latMax - lat) / (bounds.latMax - bounds.latMin)) *
                    map.height;
                return { x, y };
            }

            /**
             * Draws the altitude graph for the last 100 points.
             * Scale is quantized to 500ft buckets and only ever expands,
             * never shrinks - a sudden altitude spike does not compress the
             * whole history.  Notes appear as gold dots on the graph line.
             * The graphScale div below the graph shows current scale and
             * distance to north vent.
             *
             * 2026-05-07: never-shrink rules added.
             */
            function drawGraph() {
                let slice = points.slice(-100);

                gctx.clearRect(0, 0, graph.width, graph.height);
                if (slice.length < 2) return;

                // override values take priority, then auto, then Kilauea defaults
                let range = getDisplayRange();
                let rawMin = range.min !== null ? range.min : 3000;
                let rawMax = range.max !== null ? range.max : 4500;

                // quantize to 500ft buckets - only ever expand, never shrink
                let min = Math.floor(rawMin / 500) * 500;
                let max = Math.ceil(rawMax / 500) * 500;
                if (max === min) max += 500;

                let lastPt = points[points.length - 1];
                let ventStr = lastPt
                    ? distToNorthVent(lastPt.lat, lastPt.lon).display
                    : " ";
                document.getElementById("graphScale").innerText =
                    "scale: " + min + " to " + max + " ft    |    north vent: " + ventStr;
                document.getElementById("graphScale").style.textAlign = "left";

                gctx.fillStyle = "#888";
                gctx.font = "20px sans-serif";
                gctx.textAlign = "right";

                for (let a = min; a <= max; a += 500) {
                    let y =
                        graph.height - ((a - min) / (max - min)) * graph.height;
                    gctx.strokeStyle = "#222";
                    gctx.beginPath();
                    gctx.moveTo(0, y);
                    gctx.lineTo(graph.width, y);
                    gctx.stroke();
                    gctx.fillText(a + " ft", 80, y + 3);
                }

                for (let i = 1; i < slice.length; i++) {
                    let x1 = ((i - 1) / 100) * graph.width;
                    let x2 = (i / 100) * graph.width;

                    let y1 =
                        graph.height -
                        ((slice[i - 1].alt - min) / (max - min)) * graph.height;
                    let y2 =
                        graph.height -
                        ((slice[i].alt - min) / (max - min)) * graph.height;

                    gctx.strokeStyle = "#00ccff";
                    gctx.lineWidth = 1;
                    gctx.beginPath();
                    gctx.moveTo(x1, y1);
                    gctx.lineTo(x2, y2);
                    gctx.stroke();

                    if (slice[i].note) {
                        gctx.fillStyle = "#ffcc00";
                        gctx.beginPath();
                        gctx.arc(x2, y2, 5, 0, Math.PI * 2);
                        gctx.fill();
                    }
                }

                gctx.strokeStyle = "#777777";
                gctx.lineWidth = 3;
                gctx.strokeRect(0, 0, graph.width, graph.height);
            }

            /**
             * Updates the readout pre element with the latest GPS fix values.
             * If the point has a note field, displays it in status2.
             * Timestamp is reformatted from yyyy-MM-dd_HH-mm-ss to
             * yyyy-MM-dd HH:mm:ss for readability.
             */
            function updateUI(d) {
                let lat = fmtLatLon(d.lat);
                let lon = fmtLatLon(d.lon);
                let alt = Math.round(d.alt * 10) / 10;
                let acc = Math.round(d.acc);
                let spd = Math.round(d.spd);
                let crs = Math.round(d.crs);

                if (d.note) {
                    document.getElementById("status2").innerText = d.note;
                }

                let ft = d.t
                    .replace("_", " ")
                    .replace(/-(\d{2})-(\d{2})$/, ":$1:$2");

                document.getElementById("readout").innerText =
                    `Lat,Lon: ${lat}, ${lon} \n Alt: ${alt} Acc: ${acc} MPH: ${spd} Crs: ${crs} \n ${ft} Pts: ${points.length}`;
            }

            /**
             * Submits a free-text note from the noteInput field as a mark.
             * Clears the input and dismisses the keyboard after submission.
             * Enter key also triggers this via the keydown listener in main().
             */
            function submitNote() {
                let input = document.getElementById("noteInput");
                let val = input.value.trim();
                if (!val) return;
                mark(val);
                input.value = "";
                input.blur();
            }

            /**
             * Writes a mark to the log via AndroidBridge.mark().
             * Default note is "M" - the one-tap panic button for when typing
             * is not an option.  Sound button taps and free-text notes both
             * call this function with their respective strings.
             *
             * A 5-second soft debounce prevents accidental double-marks.
             * The mark JSON is constructed here on the JS side from the most
             * recent point in the points array, with a fresh HST timestamp.
             * AndroidBridge.mark() writes it verbatim and resets the deadband.
             *
             * mark() serves triple duty: free-text notes, sound event markers,
             * and the M panic button.  The note field distinguishes them but
             * this function does not care - it sends whatever string it receives.
             */
            function mark(note = "M") {
                let now = Date.now();

                document.getElementById("status2").innerText = "MARK pressed";

                if (now - lastMarkTime < 5000) {
                    return; // soft debounce: 5 seconds between marks
                }

                lastMarkTime = now;

                if (typeof AndroidBridge !== "undefined") {
                    let d = points[points.length - 1];
                    if (!d) return;

                    let ft = toHST();

                    let obj = {
                        t: ft,
                        lat: fmtLatLon(d.lat),
                        lon: fmtLatLon(d.lon),
                        alt: Math.round(d.alt * 10) / 10,
                        acc: Math.round(d.acc),
                        spd: Math.round(d.spd),
                        crs: Math.round(d.crs),
                        note: note,
                    };

                    AndroidBridge.mark(JSON.stringify(obj));
                }
            }

            /**
             * Receives a GPS fix from LocationService via evaluateJavascript().
             * Ignored during replay.  Parses the JSON, formats coordinates,
             * updates the points array (1500 point cap), updates the UI,
             * and redraws the map and graph.
             *
             * Non-trackpoint lines (no "t" field) - such as say() messages
             * forwarded from Java - are pushed to logLines raw without formatting.
             *
             * The raw JSON passed in is considerably reformatted before display.
             * The log file and the scrollbox tell different stories from the
             * same data.
             */
            function onGPSUpdate(data) {
                if (isReplaying) return;
                if (!isRunning) return;

                let d = JSON.parse(data);
                if (!d.t) {
                    logLines.push(data);
                    let ta = document.getElementById("logView");
                    ta.value = logLines.join("\n");
                    ta.scrollTop = ta.scrollHeight;
                    return;
                }
                d.lat = fmtLatLon(d.lat);
                d.lon = fmtLatLon(d.lon);
                d.alt = Math.round(d.alt * 10) / 10;
                d.acc = Math.round(d.acc * 10) / 10;
                updateAltRange(d.alt);
                points.push(d);
                let vent = distToNorthVent(d.lat, d.lon);
                d.ventDist = vent.log;

                appendLog(d);

                if (points.length > 1500) points.shift();

                updateUI(d);
                drawMap();
                drawGraph();
            }

            /**
             * Starts the logging session.  Calls AndroidBridge.startLogging()
             * with the current interval and rollover values.  Guards against
             * double-start with the isRunning flag.
             *
             * AndroidBridge availability is checked explicitly - if the bridge
             * is missing (desktop browser testing, broken WebView setup) the
             * failure is visible in the scrollbox rather than a silent hang.
             *
             * TODO: startLogging() is how the JS side starts LocationService.
             *       Once BootReceiver is implemented, the service will already
             *       be running on most starts and this call becomes a no-op
             *       due to the double-start guard in LocationService.
             */
            function start() {
                say("START pressed");
                if (isRunning) return;
                isRunning = true;

                let lvW = document.getElementById("logView").offsetWidth;
                say("logView.Width = " + lvW);

                if (typeof AndroidBridge === "undefined") {
                    say("No bridge!");
                    return;
                }

                if (typeof AndroidBridge.startLogging !== "function") {
                    say("startLogging missing!");
                    return;
                }

                say("Javascript calling bridge.startLogging");
                AndroidBridge.startLogging(interval, rollover);
                say("startLogging called");
                document.getElementById("status").innerText = "Running";
            }

            /**
             * STOP button handler.  During replay, stops the replay.
             * During normal operation, calls AndroidBridge.rotateFile()
             * to roll over to a new log file.  Does not stop logging -
             * there is no stop.  The only way to stop logging is to
             * force-close the app.
             *
             * The button label says STOP.  It has not stopped anything
             * since the earliest versions.  It is a file rotation trigger
             * with a misleading name.  Renaming it is deferred.
             *
             * TODO: Rename the STOP button to ROLL or similar.
             */
            function stop() {
                if (isReplaying) {
                    // Java calls evaluateJavascript("stopReplay()") from
                    // [HISTORY REPLAYING] button - but STOP button also works.
                    stopReplay();
                    return;
                }
                if (typeof AndroidBridge !== "undefined") {
                    let newFile = AndroidBridge.rotateNow();
                    say("New file: " + newFile);
                    document.getElementById("status").innerText = "Running";
                }
            }

            /**
             * Replays a single NDJSON line into the points array and UI.
             * Identical to the live path in onGPSUpdate() except it does
             * not call appendLog() - replay does not add to the scrollbox
             * history.  Headers and malformed lines are silently skipped
             * (no "t" field check).
             */
            function replayPoint(data) {
                let d = JSON.parse(data);
                if (!d.t) return;
                d.lat = fmtLatLon(d.lat);
                d.lon = fmtLatLon(d.lon);
                d.alt = Math.round(d.alt * 10) / 10;
                d.acc = Math.round(d.acc * 10) / 10;
                updateAltRange(d.alt);
                points.push(d);
                let vent = distToNorthVent(d.lat, d.lon);
                d.ventDist = vent.log;
                if (points.length > 1500) points.shift();
                updateUI(d);
                drawMap();
                drawGraph();
                AndroidBridge.replayPoint(JSON.stringify(d));
            }


            // Shared interval body used by replay(), resumeReplay().
            function startReplayInterval() {
                replayInterval = setInterval(() => {
                    if (replayIndex >= replayLines.length) {
                        clearInterval(replayInterval);
                        replayInterval = null;
                        isReplaying = false;
                        say("Replay complete");
                        AndroidBridge.replayComplete();
                        return;
                    }
                    // skip identical consecutive points - same lat, lon, alt
                    let line = replayLines[replayIndex];
                    replayIndex++;
                    try {
                        let d = JSON.parse(line);
                        if (d.t) {
                            // deadband: skip if identical to previous point
                            let prev = points[points.length - 1];
                            if (prev &&
                                prev.lat === fmtLatLon(d.lat) &&
                                prev.lon === fmtLatLon(d.lon) &&
                                Math.round(d.alt * 10) / 10 === prev.alt) {
                                return; // identical, skip silently
                            }
                        }
                        replayPoint(line);
                    } catch (e) {
                        say("replay err line " + replayIndex + ": " + e.message);
                    }
                }, replaySpeed);
            }

            function pauseReplay() {
                if (replayInterval === null) return;
                clearInterval(replayInterval);
                replayInterval = null;
                say("Replay paused");
            }

            function resumeReplay() {
                if (!isReplaying) return;
                if (replayInterval !== null) return;
                startReplayInterval();
                say("Replay resumed");
            }

            function stopReplay() {
                clearInterval(replayInterval);
                replayInterval = null;
                isReplaying = false;
                replayLines = [];
                replayIndex = 0;
                say("Replay stopped");
                AndroidBridge.replayComplete();
            }

            /**
             * Replays all files currently in the working directory.
             * Reads every file via AndroidBridge.getFileList() and
             * AndroidBridge.readFile(), concatenates all lines, and
             * plays them back at the selected speed.
             *
             * No cutoff filter - replays everything getFileList() returns.
             * For a 72-hour window use replay72h() instead.
             *
             * TODO: getFileList() currently returns all files including
             *       monthly rollup files.  Replay of a monthly file works
             *       but can be very slow at 1ms intervals.
             */
             function replay() {
                let fileList = JSON.parse(AndroidBridge.getFileList());
                document.getElementById("status").scrollIntoView();
                if (!fileList.length) { say("No files found"); return; }

                replayLines = [];
                for (let path of fileList) {
                    say("Reading " + path);
                    let contents = AndroidBridge.readFile(path);
                    let lines = contents.split("\n").filter((l) => l.trim());
                    replayLines = replayLines.concat(lines);
                }

                replayIndex = 0;
                replaySpeed = parseInt(document.getElementById("replaySpeed").value);
                isReplaying = true;
                AndroidBridge.replayStarting();
                startReplayInterval();
            }


            /**
             * Replays only files from the last 72 hours.
             * Monthly rollup files (day field = 00) are excluded.
             * The 72-hour cutoff is computed as a yyyy-MM-dd_HH-mm-ss
             * string for direct lexicographic comparison against filenames.
             * This works because the filename format sorts chronologically.
             *
             * 72 hours matches the consolidateOldFiles() retention window -
             * files older than 72 hours may already be consumed into the
             * monthly rollup and unavailable here.
             */
             function replay72h() {
                    let fileList = JSON.parse(AndroidBridge.getFileList());
                    document.getElementById("status").scrollIntoView();
                    if (!fileList.length) { say("No files found"); return; }

                    let cutoff = new Date(Date.now() - 72 * 60 * 60 * 1000);
                    let pad = (n) => String(n).padStart(2, "0");
                    let cutoffStr =
                        cutoff.getFullYear() + "-" +
                        pad(cutoff.getMonth() + 1) + "-" +
                        pad(cutoff.getDate()) + "_" +
                        pad(cutoff.getHours()) + "-" +
                        pad(cutoff.getMinutes()) + "-" +
                        pad(cutoff.getSeconds());

                    let recent = fileList.filter(path => {
                        let name = path.substring(path.lastIndexOf("/") + 1);
                        if (name.match(/^\d{4}-\d{2}-00_/)) return false;
                        return name >= cutoffStr;
                    });

                    say("replay72h: " + recent.length + " files after " + cutoffStr);
                    if (!recent.length) { say("No files in last 72h"); return; }

                    replayLines = [];
                    for (let path of recent) {
                        let contents = AndroidBridge.readFile(path);
                        let lines = contents.split("\n").filter((l) => l.trim());
                        replayLines = replayLines.concat(lines);
                    }

                    replayIndex = 0;
                    replaySpeed = parseInt(document.getElementById("replaySpeed").value);
                    isReplaying = true;
                    AndroidBridge.replayStarting();
                    startReplayInterval();
                }




            // Entry point.  Everything that touches the DOM or depends on
            // layout runs from here, after the browser guarantees layout is complete.
            window.addEventListener("load", main);

        </script>
</body>
</html>
